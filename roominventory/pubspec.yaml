name: roominventory
description: "RoomInventory is a cross-platform Flutter application for managing room inventories, including items, fixtures, DMX outputs, and event management. The project features Supabase authentication (including Google Sign-In), QR code generation and scanning, and a modern, responsive UI with Cupertino (iOS-style) widgets."
publish_to: 'none'
version: 2.0.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.3.0
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  uuid: ^4.5.1
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.3.0
  path_provider: ^2.0.14
  permission_handler: ^12.0.1
  file_saver: ^0.3.1
  intl: ^0.19.0
  table_calendar: ^3.0.9
  image_picker: ^1.0.4
  qr_flutter: ^4.1.0
  share_plus: ^11.1.0
  qr_code_scanner_plus: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true